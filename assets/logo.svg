<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="t d">
  <title id="t">Button Glyphs</title>
  <desc id="d">Four face buttons in a diamond, each with a different symbol, around two arrows that swap them.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#262B3D"/>
      <stop offset="1" stop-color="#151822"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <rect x="3" y="3" width="250" height="250" rx="53" fill="none" stroke="#FFFFFF" stroke-opacity=".08" stroke-width="2"/>

  <!-- top: triangle -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke="#08BFB5">
    <circle cx="128" cy="58" r="30"/>
    <path d="M128 44 L141 67 H115 Z"/>
  </g>
  <!-- right: circle -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke="#D65C5C">
    <circle cx="198" cy="128" r="30"/>
    <circle cx="198" cy="128" r="10"/>
  </g>
  <!-- bottom: cross -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke="#8290BA">
    <circle cx="128" cy="198" r="30"/>
    <path d="M118 188 L138 208 M138 188 L118 208"/>
  </g>
  <!-- left: square -->
  <g fill="none" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" stroke="#D98CB2">
    <circle cx="58" cy="128" r="30"/>
    <rect x="48" y="118" width="20" height="20" rx="2.5"/>
  </g>

  <!-- centre: swap arrows -->
  <g fill="none" stroke="#AFC1D1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M108 122 A20 20 0 0 1 144 118"/>
    <path d="M148 134 A20 20 0 0 1 112 138"/>
  </g>
  <g fill="#AFC1D1">
    <path d="M147 106 L149 124 L132 118 Z"/>
    <path d="M109 150 L107 132 L124 138 Z"/>
  </g>
</svg>
